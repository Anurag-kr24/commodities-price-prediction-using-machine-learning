<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Price Prediction Dashboard</h1>
        <form id="predictionForm">
            <div class="form-group">
                <label for="model">Select Model:</label>
                <select id="model" class="form-control">
                    <option value="arima">ARIMA</option>
                    <option value="prophet">Prophet</option>
                    <option value="xgboost">XGBoost</option>
                </select>
            </div>
            <div class="form-group">
                <label for="future_days">Enter the number of days to predict:</label>
                <input type="number" id="future_days" class="form-control" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Get Predictions</button>
        </form>
        <div id="predictionResults" class="mt-4">
            <h3>Predictions:</h3>
            <div id="predictionGraph"></div>
            <table id="predictionTable" class="table table-bordered mt-3">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Gold Predicted Price</th>
                        <th>Silver Predicted Price</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let model = document.getElementById('model').value;
            let future_days = document.getElementById('future_days').value;

            let requestData = {
                model: model,
                days: future_days
            };

            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    let dates = data.dates;
                    let gold_predictions = data.gold;
                    let silver_predictions = data.silver;
                    
                    let tableBody = document.querySelector('#predictionTable tbody');
                    tableBody.innerHTML = ''; 
                    for (let i = 0; i < dates.length; i++) {
                        let row = `<tr><td>${dates[i]}</td><td>${gold_predictions[i]}</td><td>${silver_predictions[i]}</td></tr>`;
                        tableBody.innerHTML += row;  
                    }

                    let goldTrace = {
                        x: dates,
                        y: gold_predictions,
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: 'Gold Price Prediction'
                    };
                    let silverTrace = {
                        x: dates,
                        y: silver_predictions,
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: 'Silver Price Prediction'
                    };
                    let layout = { title: 'Gold & Silver Price Prediction Graph' };
                    Plotly.newPlot('predictionGraph', [goldTrace, silverTrace], layout);
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
